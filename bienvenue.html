<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6855d9">
<title>Étudia — Ouvrir l'application</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/styles.css">
<style>
  .landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  .landing .logo{font:700 28px Fraunces,serif;margin-bottom:14px}
  .landing .logo span{color:var(--purple)}
  .landing p.lead{max-width:320px;margin:0 auto 28px}
  .landing a.primary{display:inline-block;text-decoration:none;background:var(--purple);color:white;font-size:17px;padding:18px 32px}
  .landing .steps{margin-top:40px;text-align:left;max-width:300px}
  .landing .steps div{display:flex;gap:10px;margin-bottom:14px;color:var(--muted);font-size:14px;line-height:1.4}
  .landing .steps b{color:var(--ink)}
</style>
</head>
<body>
<div class="landing">
  <div class="logo">Étudia <span>✦</span></div>
  <h1>Ton tuteur personnel</h1>
  <p class="lead">Crée des cours, révise avec des quiz, et suis tes progrès — directement dans ton navigateur, sans rien installer.</p>
  <a class="primary" href="index.html">Ouvrir Étudia</a>
  <div class="steps">
    <div><b>1.</b>&nbsp;Appuie sur le bouton ci-dessus.</div>
    <div><b>2.</b>&nbsp;Entre ton prénom et ta classe.</div>
    <div><b>3.</b>&nbsp;Crée ton premier cours !</div>
  </div>
</div>
</body>
</html>
